name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install application and quality tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/astraforge
      - name: Unit tests
        run: pytest -q --disable-warnings --maxfail=1
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --strict

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: astraforge-agentic-ai:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: astraforge-agentic-ai:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/astraforge-agentic-ai:latest
            ghcr.io/${{ github.repository_owner }}/astraforge-agentic-ai:${{ github.sha }}
